[project]
name = "market-intelligence"
version = "0.1.0"
description = "AI Market Scanning Engine for the Indian stock market"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Generated Protobuf bindings — never hand-edited, not ours to lint/format.
extend-exclude = ["app/providers/upstox_proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Generated Protobuf bindings — untyped/dynamic by nature, never hand-edited.
# `exclude` alone only stops direct discovery; modules that import it (e.g.
# upstox_websocket.py) would still pull it in via follow_imports, so also
# skip following into it from there.
exclude = ["app/providers/upstox_proto/.*_pb2\\.py$"]

[[tool.mypy.overrides]]
module = "app.providers.upstox_proto.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
